name: CI

# O CI roda só o que é DETERMINÍSTICO e não precisa de GPU/banco/LLM:
# lint, testes e o gate de regressão NÍVEL A (contrato). Os níveis B (replay contra o gold) e
# C (live, com o LLM) rodam na máquina que tem a fundação/GPU — ver docs/FASE5_MLOPS.md.
# Motivo: um CI que depende de LLM em GPU flaka, e gate que flaka é gate que o time ignora.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      # v5/v6 rodam em Node 24. As versões anteriores (checkout@v4, setup-python@v5) ainda
      # funcionam, mas o runner emite anotação de depreciação — e anotação amarela na página do
      # Actions é exatamente o tipo de ruído que faz ninguém mais olhar para o CI (F22).
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # `[test]` e não `[dev]`: a suíte importa fastapi (extra [serve]) em tests/test_servico*.py.
      # Com `[dev]` a COLETA do pytest quebrava e o build ficava vermelho — ver docs/FASE22_CI.md.
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Lint (ruff)
        run: ruff check .

      # A coleta é verificada ANTES de rodar: se um teste não importar (extra faltando), o build
      # falha aqui com a causa explícita, em vez de num traceback no meio de 200 testes.
      - name: Coleta completa (nenhum teste some por falta de extra)
        run: python verificar_coleta.py

      - name: Testes
        run: pytest -q

      - name: Gate de regressão (nível A — contrato)
        # Falha o build se: o selo do golden TEST mudou, os agregados do relatório não batem
        # com os itens, o EX/abstenção regrediram ou a vantagem sobre o baseline sumiu.
        run: python gate_regressao.py
