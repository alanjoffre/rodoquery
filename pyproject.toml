[project]
name = "rodoquery"
version = "0.1.0"
description = "Agente de Analytics (Text-to-SQL) sobre um lakehouse governado, com avaliação rigorosa."
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.0",
    "sqlglot>=25.0",
    "pydantic-settings>=2.0",
    "numpy>=2.0",
]

[project.optional-dependencies]
# LLM local (agente) — adicionado nas fases 3+.
# ⚠️ NÃO É MAIS IMPORTADO: o cliente do Ollama fala HTTP por `urllib` da stdlib (medido na F22 —
# `grep` por `import httpx|ollama` em src/ e na raiz não acha nada). Fica declarado porque o
# Dockerfile o instala e os 624 MB de imagem medidos na F16 INCLUEM estes pacotes; remover sem
# re-medir tornaria aquele número falso. Backlog: remover e re-medir a imagem no mesmo commit.
llm = ["httpx>=0.27", "ollama>=0.3"]
# Serving (fase 6)
serve = ["fastapi>=0.115", "uvicorn>=0.30"]
# SUT via API (fase 18). EXTRA de propósito: o caminho default é o Ollama local, e o import do
# SDK é tardio — quem só reproduz as Fases 0–16 não precisa instalar nada disto.
api = ["anthropic>=0.60"]
# Planilha de anotação humana (fase 14). EXTRA: o import é tardio, dentro das funções de
# export/import — quem não vai anotar em XLSX não precisa instalar.
xlsx = ["openpyxl>=3.1"]
dev = ["ruff>=0.6", "pytest>=8.0"]
# Tudo que a SUÍTE precisa para COLETAR. Existe porque o CI instalava só [dev] e
# tests/test_servico*.py importam `fastapi` (extra [serve]): a coleta explodia, o build ficou
# vermelho por 32 execuções seguidas (12 dias) e ninguém olhou. Um extra NOMEADO é melhor que uma
# mágica no YAML — teste novo que exija um extra entra aqui, e o CI acompanha sozinho.
test = ["rodoquery[dev,serve,api,xlsx]"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Só coleta a suíte em tests/. Sem isto, scripts de raiz como `load_test.py` casam com o padrão
# `*_test.py` e o pytest tenta importá-los (eles leem sys.argv e quebram a coleta).
testpaths = ["tests"]
# A raiz do repo no sys.path, EXPLICITAMENTE. Sem isto, `pytest` (console script) não importa os
# scripts de raiz — `tests/test_anotar_humano.py` faz `import anotar_humano` —, enquanto
# `python -m pytest` importa, porque o `-m` põe o cwd no sys.path sozinho. Era essa diferença de
# INVOCAÇÃO que separava a minha máquina do runner: eu rodava `python -m pytest` e o CI, `pytest`.
# Declarar aqui faz as duas formas concordarem, em vez de depender de como cada um digita.
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Estes arquivos embutem o dicionário de schema / prompt do LLM como strings: o comprimento de linha
# desses dados é irrelevante (o modelo lê texto corrido), então E501 é ruído só aqui.
"src/rodoquery/baselines.py" = ["E501"]
"src/rodoquery/sistema.py" = ["E501"]
"src/rodoquery/sistema_v2.py" = ["E501"]
"src/rodoquery/perturbacao.py" = ["E501"]
