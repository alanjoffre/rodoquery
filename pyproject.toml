[project]
name = "rodoquery"
version = "0.1.0"
description = "Agente de Analytics (Text-to-SQL) sobre um lakehouse governado, com avaliação rigorosa."
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.0",
    "sqlglot>=25.0",
    "pydantic-settings>=2.0",
    "numpy>=2.0",
]

[project.optional-dependencies]
# LLM local (agente) — adicionado nas fases 3+
llm = ["httpx>=0.27", "ollama>=0.3"]
# Serving (fase 6)
serve = ["fastapi>=0.115", "uvicorn>=0.30"]
# SUT via API (fase 18). EXTRA de propósito: o caminho default é o Ollama local, e o import do
# SDK é tardio — quem só reproduz as Fases 0–16 não precisa instalar nada disto.
api = ["anthropic>=0.60"]
dev = ["ruff>=0.6", "pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Só coleta a suíte em tests/. Sem isto, scripts de raiz como `load_test.py` casam com o padrão
# `*_test.py` e o pytest tenta importá-los (eles leem sys.argv e quebram a coleta).
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Estes arquivos embutem o dicionário de schema / prompt do LLM como strings: o comprimento de linha
# desses dados é irrelevante (o modelo lê texto corrido), então E501 é ruído só aqui.
"src/rodoquery/baselines.py" = ["E501"]
"src/rodoquery/sistema.py" = ["E501"]
"src/rodoquery/sistema_v2.py" = ["E501"]
"src/rodoquery/perturbacao.py" = ["E501"]
