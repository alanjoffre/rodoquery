[project]
name = "rodoquery"
version = "0.1.0"
description = "Agente de Analytics (Text-to-SQL) sobre um lakehouse governado, com avaliação rigorosa."
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.0",
    "sqlglot>=25.0",
    "pydantic-settings>=2.0",
    "numpy>=2.0",
]

[project.optional-dependencies]
# LLM local (agente) — adicionado nas fases 3+
llm = ["httpx>=0.27", "ollama>=0.3"]
# Serving (fase 6)
serve = ["fastapi>=0.115", "uvicorn>=0.30"]
dev = ["ruff>=0.6", "pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
